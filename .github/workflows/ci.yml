name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    # Keep each frontend test process comfortably below the shell and job hard
    # timeouts as the suite grows. The shard count and the Vitest denominator
    # below must remain in sync.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See e2e.yml for why node_modules is cached wholesale: `npm ci` swings
      # between 20s and 5 minutes on an identical lockfile purely by runner.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd frontend
          echo "Running install command: npm ci"
          npm ci

      - name: Run frontend tests with hard timeout
        run: |
          set -euxo pipefail
          cd frontend
          echo "Running test command (CI, non-watch): npm run test:ci -- --shard=${{ matrix.shard }}/3"
          # Guards against a hung worker (hence the process dump below), not
          # against the suite growing: keep the cap far enough below the
          # job's 20 minutes that setup and process cleanup retain headroom.
          echo "Applying shell hard timeout: 15m"
          echo "Test step start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --foreground 15m npm run test:ci -- --shard=${{ matrix.shard }}/3
          exit_code=$?
          set -e
          echo "Test step end: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$exit_code" -eq 124 ]; then
            echo "Frontend tests were terminated by GNU timeout after 15 minutes." >&2
            echo "Active node-related processes at timeout:" >&2
            set +e
            ps -ef | grep -E 'node|vitest|v8' | grep -v grep >&2
            set -e
            exit 124
          fi
          exit "$exit_code"

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip "pdm==2.29.5" "hishel==1.4.0"

      - name: Install gettext
        run: |
          python3 -m unittest discover -s tests -p test_install_gettext.py
          bash scripts/ci/install-gettext.sh

      - name: Ensure pdm.lock exists
        run: |
          test -f backend/pdm.lock || (echo 'backend/pdm.lock is missing' >&2; exit 1)

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test

      - name: Run Django deployment security checks
        env:
          DEBUG: 'False'
          DJANGO_ENV: production
          SECRET_KEY: ci-only-deployment-check-secret-key-not-used-at-runtime
          ALLOWED_HOSTS: openfarmplanner.example
          FRONTEND_URL: https://openfarmplanner.example
          PUBLIC_FRONTEND_URL: https://openfarmplanner.example
        run: |
          cd backend
          pdm run python manage.py check --deploy --fail-level WARNING

      - name: Run backend tests
        run: |
          cd backend
          pdm run compilemessages
          pdm run test

  # SQLite ignores row locks (`select_for_update`), so regressions that only
  # PostgreSQL raises are pinned by tests marked `postgres` and run here
  # against a real PostgreSQL server. See docs/testing-and-ci.md.
  backend-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmplanner
          POSTGRES_PASSWORD: farmplanner
          POSTGRES_DB: farmplanner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip "pdm==2.29.5" "hishel==1.4.0"

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test

      - name: Run PostgreSQL-only backend tests
        env:
          TEST_DB_ENGINE: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          cd backend
          pdm run test -m postgres -n0 --no-cov --create-db

  security-review-completion:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Evaluate security review completion
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number,
            });
            if (current.head.sha !== pr.head.sha) throw new Error('Stale CI head; a new push needs new checks.');
            let policy;
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: '.github/scripts/security-review-completion.cjs', ref: pr.base.sha,
              });
              policy = Buffer.from(data.content, 'base64').toString();
            } catch (error) {
              if (error.status !== 404) throw error;
              // First installation has no trusted base policy. Only an explicit
              // human maintainer's exact-head review can approve the bootstrap.
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: pr.number, per_page: 100,
              });
              const command = `/security-review bootstrap ${pr.head.sha}`;
              const statement = 'I independently reviewed this exact commit and approve installing the security review gate.';
              for (const comment of comments) {
                const body = (comment.body ?? '').replace(/\r\n?/g, '\n');
                if (comment.user?.type !== 'User' ||
                    body.split('\n')[0] !== command || !body.split('\n').includes(statement)) continue;
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username: comment.user.login,
                });
                if (!['admin', 'maintain'].includes(permission.permission) && !permission.user?.permissions?.maintain) continue;
                await core.summary.addHeading('Security review completion').addRaw(
                  `State: **manual_review_approved** (first-install bootstrap)\n\nHead: ${pr.head.sha}\n\n` +
                  `Explicit human review: ${comment.html_url}\n\nThis is not automated security review completion.\n`).write();
                return;
              }
              throw new Error('First-install security gate requires an explicit human maintainer review and exact-head bootstrap approval. Authoring-agent self-review is not approval.');
            }
            // Execute policy from the immutable PR base, with a read-only token.
            // No PR checkout code is loaded by this privileged API-reading step.
            const fs = require('node:fs');
            const path = require('node:path');
            const os = require('node:os');
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'trusted-security-policy-'));
            try {
              const file = path.join(directory, 'security-review-completion.cjs');
              fs.writeFileSync(file, policy);
              await require(file).enforce({ github, context, core, expectedHead: pr.head.sha });
            } finally { fs.rmSync(directory, { recursive: true, force: true }); }

  quality:
    needs: security-review-completion
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (LTS)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip "pdm==2.29.5" "hishel==1.4.0"

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test -dG quality

      # Same wholesale node_modules cache as `frontend-tests` and the two
      # Playwright workflows, and deliberately the same key: this job needs the
      # identical tree, so it can reuse whatever any of them last saved. It was
      # the only frontend consumer left without it, and paid for that in full -
      # measured installs of 4m49s and 5m02s against a 36s quality gate, i.e.
      # the install was 90% of the job.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      # `npm ci`, not the `npm install --force` this step used to run. The
      # --force came in with the workflow's initial import rather than from a
      # resolution failure, and every other job installs this same lockfile
      # with plain `npm ci`. It also matters for the cache above: `npm install`
      # may rewrite package-lock.json, which is what the cache key hashes.
      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm ci

      - name: Run quality gate
        # The backend suite is the `backend-tests` job's, not this job's: with
        # it enabled here too, `quality` ran the identical pytest+coverage
        # command a second time and took as long as the job it duplicated.
        env:
          SKIP_BACKEND_TESTS: '1'
        run: make quality

      - name: Test security review completion policy
        run: |
          python3 -m unittest discover -s tests -p test_claude_review_fallback.py
          python3 -m unittest discover -s tests -p test_local_security_review.py
          node --test tests/test_codex_security_request.cjs tests/test_security_review_completion.cjs tests/test_signed_codex_review.cjs
          node --test tests/test_codex_queue.cjs

      - name: Enforce security review completion
        if: github.event_name == 'pull_request' && needs.security-review-completion.result != 'success'
        run: |
          echo '::error::The isolated security review completion job did not pass. Review its evidence and approval requirement.'
          exit 1

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
