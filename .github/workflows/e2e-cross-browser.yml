name: E2E cross-browser (Docker)

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-cross-browser-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-browser:
    # Functional and responsive assertions across browser engines and viewports.
    name: cross-browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - desktop-firefox
          - desktop-webkit
          - mobile-chromium
          - mobile-webkit
          - mobile-firefox
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run cross-browser suite in the Playwright Docker image
        working-directory: frontend
        run: e2e-cross-browser/run-in-docker.sh --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-cross-browser-${{ matrix.project }}
          # Failed tests retain screenshots and traces for diagnosis.
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
