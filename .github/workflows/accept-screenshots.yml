# Commits reviewed Playwright screenshot baselines to a pull request.
#
# A failing screenshot job (e2e.yml, e2e-cross-browser.yml) re-records its
# failed screenshots in the same environment and uploads them as
# `proposed-baselines-*` artifacts next to its diffs. After reviewing those
# diffs, a maintainer adds the `accept-screenshots` label; this workflow then
# commits the proposed images of the PR's current head to the PR branch and
# removes the label. The label is the human review the baseline rules in
# CLAUDE.md ("Playwright Screenshot Tests") require: nothing here accepts an
# image on its own. Details: docs/testing-and-ci.md ("Accepting changed
# baselines").

name: Accept screenshot baselines

"on":
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: accept-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  accept:
    name: Accept proposed baselines
    # Forks get no secrets and must not be pushed to.
    if: >-
      github.event.label.name == 'accept-screenshots' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ACCEPTED_BY: ${{ github.actor }}
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # A push with the default GITHUB_TOKEN starts no workflow run, which
          # would leave the new head without CI. Prefer a dedicated token;
          # RELEASE_PAT already pushes for release.yml.
          token: ${{ secrets.SCREENSHOT_BASELINE_TOKEN || secrets.RELEASE_PAT }}

      - name: Download the proposed baselines of the labeled head
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The branch has moved past $HEAD_SHA. Wait for CI on the new head, review its diffs, then add the label again."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/proposed"
          for workflow in e2e.yml e2e-cross-browser.yml; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$HEAD_SHA" --event pull_request --limit 1 --json databaseId,status)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            status="$(jq -r '.[0].status // empty' <<<"$runs")"
            if [ -z "$run_id" ]; then
              echo "No $workflow run for $HEAD_SHA."
              continue
            fi
            if [ "$status" != "completed" ]; then
              echo "::error::$workflow is still running for $HEAD_SHA. Add the label again once it has finished."
              exit 1
            fi
            # A run without failed screenshots has no proposed-baselines artifact.
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'proposed-baselines-*' --dir "$RUNNER_TEMP/proposed" \
              || echo "No proposed baselines in $workflow run $run_id."
          done

      - name: Test the baseline tooling
        run: python3 -m unittest discover -s tests -p test_screenshot_baselines.py

      # Refuses anything that is not a PNG at a baseline path, and two
      # artifacts proposing different images for the same path.
      - name: Copy the proposed baselines into the checkout
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/ci/screenshot_baselines.py apply "$RUNNER_TEMP/proposed" \
            | tee "$RUNNER_TEMP/apply.log"
          # Backticks are Markdown here, not command substitution.
          # shellcheck disable=SC2016
          sed -n 's/^accepted: \(.*\)$/- `\1`/p' "$RUNNER_TEMP/apply.log" > "$RUNNER_TEMP/accepted.txt"

      - name: Commit and push
        if: steps.apply.outputs.count != '0'
        run: |
          set -euo pipefail
          git add -- frontend/e2e frontend/e2e-cross-browser
          if git diff --cached --quiet; then
            echo "The proposed baselines equal the committed ones; nothing to push."
            echo "PUSHED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "test(e2e): accept reviewed screenshot baselines" \
            -m "Proposed by the failing screenshot jobs on ${HEAD_SHA} and accepted by ${ACCEPTED_BY} with the accept-screenshots label."
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "PUSHED=true" >> "$GITHUB_ENV"

      - name: Report on the pull request
        if: always()
        run: |
          set -euo pipefail
          # Removed in every case, so the label can be added again.
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label accept-screenshots || true
          if [ "${PUSHED:-false}" = "true" ]; then
            body="Accepted screenshot baselines proposed for \`${HEAD_SHA:0:7}\`, now committed as \`$(git rev-parse --short HEAD)\`:"$'\n\n'"$(cat "$RUNNER_TEMP/accepted.txt")"
          elif [ "${{ job.status }}" = "success" ]; then
            body="No screenshot baselines to accept for \`${HEAD_SHA:0:7}\`: its screenshot jobs proposed none, or they equal the committed images."
          else
            body="Accepting screenshot baselines for \`${HEAD_SHA:0:7}\` failed; see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
