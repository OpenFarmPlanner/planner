[project]
name = "OpenFarmPlanner-backend"
version = "1.79.1"
description = "OpenFarmPlanner - Django REST API backend for managing farm operations"
authors = [
    {name = "OpenFarmPlanner Team", email = "info@OpenFarmPlanner.com"},
]
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.17.2",
    "django-cors-headers==4.9.0",
    "requests>=2.33.0",
    "python-dotenv>=1.2.1",
    "psycopg2-binary>=2.9.11",
    "asgiref>=3.8.1",
    "sqlparse>=0.5.0",
    "Pillow>=12.3.0,<13.0.0",
    "radon>=6.0.1",
    "gunicorn>=25.3.0",
    "django-allauth[socialaccount]==65.18.0",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "daphne==4.2.2",
    "drf-spectacular==0.30.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.6.0",
    "pluggy>=1.5.0",
    "iniconfig>=2.0.0",
    "packaging>=24.0",
    "pygments>=2.18.0",
    # Runs the suite across one worker per core; see the note in pytest.ini
    # for why the distribution mode is `loadfile` and not the default.
    "pytest-xdist>=3.8.0",
]
quality = [
    "ruff==0.8.6",
    "radon==6.0.1",
]
# Local-development-only tooling. Deliberately not installed by CI
# (`pdm install -dG test [-dG quality]`) or in production, so the settings
# below must degrade gracefully when the package is absent.
dev = [
    "django-debug-toolbar>=6.1.0",
]

[tool.pdm.scripts]
migrate = "python manage.py migrate"
makemigrations = "python manage.py makemigrations"
runserver = "python manage.py runserver"
test = "python -m pytest"
createsuperuser = "python manage.py createsuperuser"
shell = "python manage.py shell"
collectstatic = "python manage.py collectstatic --noinput"
compilemessages = "python manage.py compilemessages --settings=config.settings_test --ignore=.venv"

[tool.coverage.run]
# sys.monitoring instead of the default C tracer. On Python 3.12 it measures
# line coverage only, which is all the suite collects (no --cov-branch), and it
# produced the identical per-file report at roughly a third less runtime; the
# migration tests, which spend their time in Django's migration machinery, gain
# the most. Coverage falls back to the default core, with a warning, wherever
# sysmon is unusable (e.g. if branch coverage is switched on before 3.14).
core = "sysmon"

[tool.ruff]
line-length = 100
exclude = [
    "node_modules",
    "dist",
    "build",
    ".venv",
    "farm/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
