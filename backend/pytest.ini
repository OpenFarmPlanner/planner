[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
# `-n auto` runs the suite across one worker per core. Each worker is its own
# process with its own in-memory SQLite database (settings_test), and runs its
# tests one after another, so tests on different workers share nothing.
#
# `--dist loadscope` keeps each test class (or, for plain test functions, each
# module) on one worker, but lets the classes of one file spread across
# workers. It replaced `--dist loadfile`, which pinned whole files to one
# worker: crops/tests/test_migrations_translations.py alone holds six
# migration test classes, and with loadfile that one file set the length of
# the whole run. Keeping a class together means class-level setup such as
# Django's setUpTestData runs once per class, not once per worker.
#
# The migration tests (farm/tests/test_migrations_*.py and friends) are safe
# under any distribution mode: each test migrates backwards in its setup and
# forwards to the leaf nodes again in its teardown, on its own worker's
# database. See docs/testing-and-ci.md for the measurements.
#
# Pass `-n0` to run serially again, which is what `--pdb` and any debugging that
# needs readable interleaved output want.
addopts = --reuse-db --cov=. --cov-report=term-missing -n auto --dist loadscope
