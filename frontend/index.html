<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var supported = { de: true, en: true };
        var fallback = 'en';

        function normalize(value) {
          var normalized = String(value || '').trim().toLowerCase().replace(/_/g, '-');
          if (!normalized) {
            return null;
          }
          var base = normalized.split('-')[0];
          return supported[base] ? base : null;
        }

        function readStoredPreference() {
          try {
            var stored = window.localStorage.getItem('ui.language');
            if (stored === null) {
              return null;
            }
            var normalized = String(stored || '').trim().toLowerCase();
            if (normalized === 'auto') {
              return 'auto';
            }
            return normalize(normalized);
          } catch (error) {
            return null;
          }
        }

        function detectBrowserLanguage() {
          var candidates = [];
          if (Array.isArray(navigator.languages)) {
            candidates = candidates.concat(navigator.languages);
          }
          if (navigator.language) {
            candidates.push(navigator.language);
          }
          for (var i = 0; i < candidates.length; i += 1) {
            var language = normalize(candidates[i]);
            if (language) {
              return language;
            }
          }
          return fallback;
        }

        // Prerendered public pages carry their URL-fixed language, path and
        // language versions (build/prerenderSeo.ts). A visitor whose language
        // (stored choice, otherwise browser) differs is sent to their language
        // version before first paint; crawlers never are, so each URL stays
        // indexable in its own language. Keep the crawler pattern in sync
        // with src/i18n/publicPageLanguageRedirect.ts. A static server's SPA
        // fallback may hand the same file out for another URL; then the
        // attributes are ignored.
        function currentAppPath() {
          var base = '%BASE_URL%'.replace(/\/+$/, '');
          var path = window.location.pathname;
          if (base && path.indexOf(base) === 0) {
            path = path.slice(base.length);
          }
          return path.replace(/\/+$/, '') || '/';
        }
        var root = document.documentElement;
        var pageLanguage = root.getAttribute('data-ofp-page-path') === currentAppPath()
          ? normalize(root.getAttribute('data-ofp-page-language'))
          : null;
        var preference = readStoredPreference();
        var language = preference && preference !== 'auto' ? preference : detectBrowserLanguage();
        if (pageLanguage) {
          var isCrawler = /bot\b|bot\/|crawl|spider|slurp|mediapartners|google-inspectiontool|facebookexternalhit|embedly|lighthouse|bingpreview|whatsapp|telegram|ia_archiver/i
            .test(navigator.userAgent || '');
          var alternates = null;
          try {
            alternates = JSON.parse(root.getAttribute('data-ofp-page-alternates') || 'null');
          } catch (error) {
            alternates = null;
          }
          var target = alternates && alternates[language];
          if (!isCrawler && language !== pageLanguage && typeof target === 'string') {
            root.classList.add('ofp-hide-prerender');
            window.location.replace(
              '%BASE_URL%'.replace(/\/+$/, '') + target + window.location.search + window.location.hash
            );
            return;
          }
          document.documentElement.lang = pageLanguage;
          document.documentElement.dataset.initialUiLanguage = pageLanguage;
          return;
        }
        document.documentElement.lang = language;
        document.documentElement.dataset.initialUiLanguage = language;
        if (language !== 'de') {
          document.documentElement.classList.add('ofp-hide-prerender');
        }
      }());
    </script>
    <style>
      html.ofp-hide-prerender #root {
        visibility: hidden;
      }
    </style>
    <title>OpenFarmPlanner</title>
    <!-- The meta description (and canonical/robots/OG/Twitter tags) are
         injected at build time by build/seoPlugin.ts from seoConfig.ts /
         seoAssets.ts — the single source of truth — so they stay
         route-specific for prerendered pages instead of being duplicated
         here. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
